<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀오호츠크 투자 대쉬보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f0f4fb; --surface:#ffffff; --surface2:#eef1f9;
  --accent:#6c63ff; --accent2:#ff6584;
  --green:#00b894; --red:#e84057; --yellow:#f0a500;
  --text:#1a1d35; --text2:#64748b; --border:#dde3f0; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,sans-serif;padding-bottom:60px;overflow-x:hidden}
html{overflow-x:hidden}

/* Header (minimal) */
.dash-h1{font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:4px}
.dash-subtitle{color:var(--text2);font-size:0.85rem;margin-bottom:24px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.dash-subtitle .sep{color:var(--text2);opacity:.5}
.dash-subtitle .live{color:var(--green);font-weight:600}
.dash-subtitle .refresh{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.dash-subtitle .refresh:hover{text-decoration:underline}

/* Layout */
.container{max-width:1400px;margin:0 auto;padding:28px 32px}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}
.stat-card.yellow::before{background:var(--yellow)}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:28px;font-weight:700}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-sub{font-size:12px;color:var(--text2);margin-top:4px}

/* 시장 개요 */
.market-section{margin-bottom:32px}
.market-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.market-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.market-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.market-card-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.market-card-value{font-size:17px;font-weight:700;color:var(--text)}
.market-card-change{font-size:12px;margin-top:2px;font-weight:500}
.market-card-change.up{color:var(--green)}
.market-card-change.down{color:var(--red)}
.market-card-change.flat{color:var(--text2)}
.market-charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.market-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.market-chart-head{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.market-chart-sub{font-size:11px;color:var(--text2);margin-bottom:10px}
.market-chart-wrap{position:relative;height:200px}

/* Timeline */
.timeline{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:28px}
.timeline-title{font-size:14px;font-weight:600;margin-bottom:16px}
.timeline-list{display:flex;position:relative}
.timeline-list::before{content:'';position:absolute;top:16px;left:0;right:0;height:2px;background:var(--border)}
.timeline-item{flex:1;text-align:center;position:relative;padding-top:36px}
.timeline-dot{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:1}
.timeline-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.timeline-dot.current{background:var(--green);border-color:var(--green);color:#000;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,170,.4)}50%{box-shadow:0 0 0 8px rgba(0,212,170,0)}}
.timeline-label{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.timeline-stocks{font-size:11px;font-weight:600;color:var(--text);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timeline-return{font-size:12px;font-weight:600;margin-top:2px}

/* Round tabs */
.round-tabs{display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px;margin-bottom:20px}
.round-tab{flex:1;text-align:center;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .2s;border:none;background:transparent}
.round-tab.active{background:var(--accent);color:#fff}
.round-tab:hover:not(.active):not(.locked){color:var(--text);background:var(--surface2)}
.round-tab.locked{opacity:.4;cursor:not-allowed}

/* Stock cards */
.stocks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:20px;margin-bottom:28px}
.stock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.stock-card-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2)}
.stock-info{display:flex;align-items:center;gap:12px}
.ticker-badge{background:linear-gradient(135deg,var(--accent),#9c93ff);padding:6px 12px;border-radius:8px;font-size:16px;font-weight:700;letter-spacing:1px}
.exit-badge{display:inline-block;margin-left:8px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text2);letter-spacing:.3px;vertical-align:middle}
.exit-note{font-size:11px;color:var(--text2);margin-top:4px}
.stock-name{font-size:14px;font-weight:600}
.stock-sector{font-size:11px;color:var(--text2);margin-top:2px}
.stock-price-info{text-align:right}
.current-price{font-size:22px;font-weight:700}
.price-change{font-size:13px;font-weight:600;margin-top:2px}
.price-change.up{color:var(--green)}
.price-change.down{color:var(--red)}
.stock-card-body{padding:18px 20px}
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.metric-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center}
.metric-label{font-size:10px;color:var(--text2);margin-bottom:4px;text-transform:uppercase}
.metric-value{font-size:15px;font-weight:600}
/* RSI (Relative Strength Index) */
.rsi-box{margin-bottom:16px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
.rsi-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rsi-title{font-size:11px;color:var(--text2);letter-spacing:.3px}
.rsi-title-full{opacity:.6;font-size:10px}
.rsi-value{font-size:20px;font-weight:700}
.rsi-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;margin-left:8px}
.rsi-status.oversold{background:rgba(0,184,148,.12);color:var(--green)}
.rsi-status.neutral{background:var(--border);color:var(--text2)}
.rsi-status.overbought{background:rgba(232,64,87,.12);color:var(--red)}
.rsi-bar{position:relative;height:8px;background:linear-gradient(to right,rgba(0,184,148,.25) 0%,rgba(0,184,148,.25) 30%,var(--border) 30%,var(--border) 70%,rgba(232,64,87,.25) 70%,rgba(232,64,87,.25) 100%);border-radius:4px;overflow:visible}
.rsi-pointer{position:absolute;top:-2px;width:2px;height:12px;background:var(--text);transform:translateX(-1px);border-radius:1px}
.rsi-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:4px;opacity:.7}
.rsi-empty{font-size:11px;color:var(--text2);text-align:center;padding:6px 0}
/* News (per stock card) */
.news-section{margin-top:12px}
.news-section-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
.news-articles{display:flex;flex-direction:column;gap:8px}
.news-article{padding:8px 10px;border-radius:6px;background:var(--surface2);border-left:3px solid var(--border)}
.news-article.positive{border-left-color:var(--green);background:rgba(0,184,148,.06)}
.news-article.negative{border-left-color:var(--red);background:rgba(232,64,87,.06)}
.news-article-title{font-size:0.83rem;color:var(--text);line-height:1.45;margin-bottom:5px;word-break:keep-all;overflow-wrap:break-word}
.news-article-meta{font-size:0.70rem;color:var(--text2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.news-article-link{font-size:0.70rem;color:var(--accent);border:1px solid var(--border);border-radius:4px;padding:1px 8px;text-decoration:none;white-space:nowrap;margin-left:auto}
.news-article-link:hover{background:var(--surface2)}

/* Allocation */
.allocation-section{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:28px}
.hof-banner{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.hof-card{background:linear-gradient(135deg,#fff8e6,#fff);border:1px solid #f0d580;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(240,165,0,.06)}
.hof-crown{font-size:14px;flex-shrink:0}
.hof-head{font-size:10px;color:#a07800;font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.hof-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border:1px solid #f0d580}
.hof-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hof-season{display:inline-block;margin-left:4px;padding:1px 6px;background:rgba(240,165,0,.15);color:#a07800;border-radius:4px;font-size:10px;font-weight:600;vertical-align:middle}
.hof-season + .hof-season{margin-left:2px}
.hof-sub{font-size:10px;color:var(--text2)}
.hof-value{font-size:16px;font-weight:700;margin-left:auto;flex-shrink:0}
.hof-empty{padding:10px;text-align:center;font-size:11px;color:var(--text2);flex:1}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:16px}
.legend-list{display:flex;flex-direction:column;gap:10px}
.legend-item{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.legend-left{display:flex;align-items:center;gap:8px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.progress-bar-wrap{flex:1;margin:0 12px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:3px}
.legend-pct{font-size:12px;color:var(--text2);min-width:36px;text-align:right}

/* Members table */
.members-section{margin-bottom:28px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:600}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--surface2)}
th{padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
th.right{text-align:right}
td{padding:14px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
td.right{text-align:right}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(108,99,255,.04)}
.member-name{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.pnl-bar-wrap{display:flex;align-items:center;gap:8px;min-width:160px}
.pnl-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.pnl-bar-fill{height:100%;border-radius:3px}
.pnl-bar-fill.pos{background:var(--green)}
.pnl-bar-fill.neg{background:var(--red)}
.rank-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.r1{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000}
.r2{background:linear-gradient(135deg,#c0c0c0,#a0a0a0);color:#000}
.r3{background:linear-gradient(135deg,#cd7f32,#a05a2c);color:#fff}
.rn{background:var(--surface2);color:var(--text2)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tg{background:rgba(0,212,170,.15);color:var(--green)}
.tr{background:rgba(255,77,109,.15);color:var(--red)}
.ty{background:rgba(145,152,181,.15);color:var(--text2)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,30,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:480px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px}
.modal-close:hover{color:var(--text)}
.empty-state{text-align:center;padding:48px;color:var(--text2);font-size:14px;grid-column:1/-1}
.empty-state .icon{font-size:40px;margin-bottom:12px}

/* Season tabs */
.season-bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.season-bar-label{font-size:12px;color:var(--text2);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.alerts-bar{display:none;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.alerts-bar.show{display:flex}
.alert-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid transparent}
.alert-pill.buy   {background:rgba(0,184,148,.08);color:var(--green);border-color:rgba(0,184,148,.35)}
.alert-pill.sell  {background:rgba(232,64,87,.08);color:var(--red);border-color:rgba(232,64,87,.35)}
.alert-pill.info  {background:rgba(108,99,255,.08);color:var(--accent);border-color:rgba(108,99,255,.35)}
.alert-pill.warn  {background:rgba(240,165,0,.10);color:#c68400;border-color:rgba(240,165,0,.40)}
.alert-icon{font-size:14px;line-height:1}
.view-mode-bar{display:none;align-items:center;gap:10px;margin-bottom:20px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:12px;flex-wrap:wrap}
.view-mode-bar.show{display:flex}
.view-mode-bar .vm-label{color:var(--text2);margin-right:auto}
.view-mode-btn{padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s}
.view-mode-btn:hover{border-color:var(--accent);color:var(--text)}
.view-mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.season-select{padding:7px 34px 7px 18px;border-radius:20px;border:1px solid var(--accent);background:var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path fill='%23ffffff' d='M6 8L2 4h8z'/></svg>") no-repeat right 12px center;background-size:10px;color:#fff;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 2px 12px rgba(108,99,255,.3);appearance:none;-webkit-appearance:none;-moz-appearance:none}
.season-select:focus{outline:none;box-shadow:0 0 0 3px rgba(108,99,255,.25),0 2px 12px rgba(108,99,255,.3)}
.season-select option{background:var(--surface);color:var(--text);font-weight:500}

.m-cards{display:none;flex-direction:column;gap:12px}
.m-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.m-card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.m-card-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.m-row{display:flex;justify-content:space-between;font-size:13px}
.m-row-label{color:var(--text2)}
.m-holdings{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

/* 태블릿 (901~1180px): 부수 컬럼 감춤 */
@media(min-width:901px) and (max-width:1180px){
  #mainMemberTable thead th:nth-child(7),
  #mainMemberTable thead th:nth-child(8),
  #mainMemberTable tbody td:nth-child(7),
  #mainMemberTable tbody td:nth-child(8){display:none}
}

@media(max-width:900px){
  /* 레이아웃 */
  .container{padding:14px 12px}

  /* 헤더 */
  .dash-h1{font-size:1.15rem}
  .dash-subtitle{font-size:0.78rem;margin-bottom:16px}

  /* 시즌 셀렉트 */
  .season-select{padding:6px 30px 6px 14px;font-size:12px}

  /* 통계 카드 */
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
  .stat-card{padding:14px 16px}
  .stat-value{font-size:20px}

  /* 타임라인 */
  .timeline{padding:14px 12px}
  .timeline-label{font-size:10px}
  .timeline-stocks{font-size:10px}
  .timeline-return{font-size:11px}
  .timeline-dot{width:28px;height:28px;font-size:11px}

  /* 시장 개요 */
  .market-cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .market-card{padding:10px 12px}
  .market-card-value{font-size:14px}
  .market-charts{grid-template-columns:1fr;gap:10px}
  .market-chart-wrap{height:160px}

  /* 회차 탭 */
  .round-tabs{padding:4px;gap:4px}
  .round-tab{padding:7px 6px;font-size:11px}

  /* 종목 카드 */
  .stocks-grid{grid-template-columns:1fr}
  .stock-card-header{padding:12px 14px}
  .stock-card-body{padding:12px 14px}
  .stock-name{font-size:13px}
  .current-price{font-size:18px}
  .ticker-badge{font-size:13px;padding:4px 10px}
  .metrics-row{gap:8px}
  .metric-box{padding:8px 10px}
  .metric-value{font-size:13px}
  .rsi-value{font-size:17px}
  .news-grid{grid-template-columns:1fr;gap:10px}

  /* 배분/TOP 섹션 */
  .allocation-section{grid-template-columns:1fr}
  .hof-banner{grid-template-columns:1fr;gap:12px}

  /* 테이블 → 카드 */
  .desktop-table{display:none}
  .m-cards{display:flex}
  .section-title{font-size:14px}

  /* 모달 */
  .modal{width:95vw;padding:16px}
}

@media(max-width:480px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .stat-card{padding:12px}
  .stat-value{font-size:17px}
  .stat-sub{font-size:11px}
  .dash-h1{font-size:1rem}
  .dash-subtitle{font-size:0.72rem;gap:4px 3px}
  .timeline-list::before{top:13px}
  .timeline-dot{width:26px;height:26px;font-size:10px}
  .timeline-item{padding-top:32px}
  .round-tab{font-size:10px;padding:6px 4px}
  .ticker-badge{font-size:12px;padding:4px 8px}
  .current-price{font-size:16px}
  .season-select{padding:5px 28px 5px 12px;font-size:11px}
}
</style>
</head>
<body>

<div class="container">
  <h1 class="dash-h1">📊 팀오호츠크 투자 대쉬보드</h1>
  <div class="dash-subtitle">
    <span id="lastUpdated">로딩 중...</span>
    <span class="sep">|</span>
    <span class="live">● LIVE</span>
    <span class="sep">|</span>
    <span id="nextRefresh"></span>
    <span class="sep">|</span>
    <a class="refresh" onclick="refresh()">↻ 새로고침</a>
  </div>

  <div class="market-section" id="marketSection">
    <div class="market-title">📊 시장 개요 · 최근 3개월</div>
    <div class="market-cards" id="marketCards"></div>
    <div class="market-charts" id="marketCharts"></div>
  </div>

  <div class="season-bar" id="seasonBar"></div>

  <div class="hof-banner" id="hofBanner">
    <div class="hof-card" id="hofRateCard"></div>

let DATA = SEED;
let curSeason = '26봄';
let curRound = 3;

// ── 유틸 ──────────────────────────────────────────
function currentSeason() {
  return DATA.seasons.find(s => s.id === curSeason) || DATA.seasons[0] || { id:'', rounds:[] };
}

function stockMap() {
  const m = {};
  currentSeason().rounds.forEach(r => r.stocks.forEach(s => { m[s.ticker] = s; }));
  return m;
}

let viewMode = localStorage.getItem('okhotsk_view_mode') || 'exit';

function priceOf(s) {
  return viewMode === 'live' ? (s.livePrice || s.currentPrice) : s.currentPrice;
}

function globalStockMap() {
  const m = {};
  DATA.seasons.forEach(sn => {
    m[sn.id] = {};
    sn.rounds.forEach(r => r.stocks.forEach(s => { m[sn.id][s.ticker] = s; }));
  });
  return m;
}

function memberSeasonStats(member, gsm) {
  const bySeason = {};
  member.holdings.forEach(h => {
    const s = (gsm[h.season] || {})[h.ticker];
    if (!s) return;
    if (!bySeason[h.season]) bySeason[h.season] = { season: h.season, cost: 0, val: 0 };
    bySeason[h.season].cost += h.quantity * h.buyPrice;
    bySeason[h.season].val  += h.quantity * priceOf(s);
  });
  return Object.values(bySeason)
    .filter(x => x.cost > 0)
    .map(x => ({ ...x, pnl: x.val - x.cost, pct: (x.val - x.cost) / x.cost * 100 }));
}

function hasExitedStock() {
  return currentSeason().rounds.some(r => r.stocks.some(s => s.exitDate));
}

function setViewMode(mode) {
  viewMode = mode;
  localStorage.setItem('okhotsk_view_mode', mode);
  updateViewModeBar();
  renderStats();
  renderTimeline();
  renderStocks();
  renderRoundMembers();
  renderAllocation();
  renderTop();
  renderTable();
  renderHallOfFame();
  renderAlerts();
}

function updateViewModeBar() {
  const bar = document.getElementById('viewModeBar');
  if (!bar) return;
  bar.classList.toggle('show', hasExitedStock());
  bar.querySelectorAll('.view-mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === viewMode);
  });
}

function memberStats(member) {
  const sm = stockMap();
  let cost = 0, val = 0;
  member.holdings.filter(h => h.season === curSeason).forEach(h => {
    const s = sm[h.ticker];
    if (!s) return;
    cost += h.quantity * h.buyPrice;
    val  += h.quantity * priceOf(s);
  });
  const pnl = val - cost;
  const pct = cost > 0 ? pnl / cost * 100 : 0;
  return { cost, val, pnl, pct };
}

function usd(n) {
  return '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pct(n) {
  return (n >= 0 ? '+' : '') + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
}
function clr(n) { return n >= 0 ? 'var(--green)' : 'var(--red)'; }

// 현재 시즌에 참여한 멤버만 반환
function seasonMembers() {
  return DATA.members.filter(m => m.holdings.some(h => h.season === curSeason));
}

// ── 렌더 ──────────────────────────────────────────
function renderStats() {
  const sm = stockMap();
  let totalCost = 0, totalVal = 0;
  seasonMembers().forEach(m => {
    const s = memberStats(m);
    totalCost += s.cost;
    totalVal  += s.val;
  });
  const totalPnl = totalVal - totalCost;
  const totalPct = totalCost > 0 ? totalPnl / totalCost * 100 : 0;
  const smem = seasonMembers();
  const allStats = smem.map(m => { const s = memberStats(m); return {...m, cost:s.cost, val:s.val, pnl:s.pnl, rate:s.pct}; });
  const active  = allStats.filter(m => m.cost > 0);
  const best    = active.length ? [...active].sort((a,b) => b.rate - a.rate)[0] : null;
  const bestPnl = active.length ? [...active].sort((a,b) => b.pnl  - a.pnl )[0] : null;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card ${totalPnl>=0?'green':'red'}">
      <div class="stat-label">전체 수익률</div>
      <div class="stat-value" style="color:${clr(totalPnl)}">${pct(totalPct)}</div>
      <div class="stat-sub">${totalPnl>=0?'+':''}${usd(totalPnl)} 평가 손익</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">총 투자 금액</div>
      <div class="stat-value">${usd(totalCost)}</div>
      <div class="stat-sub">${smem.length}명 참여</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">수익률 TOP</div>
      <div class="stat-value" style="color:var(--yellow);font-size:22px">${best ? best.name : '—'}</div>
      <div class="stat-sub">${best ? pct(best.rate) : ''}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">수익금 TOP</div>
      <div class="stat-value" style="color:var(--green);font-size:22px">${bestPnl ? bestPnl.name : '—'}</div>
      <div class="stat-sub">${bestPnl ? (bestPnl.pnl>=0?'+':'') + usd(bestPnl.pnl) : ''}</div>
    </div>`;
}

function renderTimeline() {
  const html = currentSeason().rounds.map(r => {
    const tickers = r.stocks.map(s => s.ticker).join(' · ') || '미정';
    let ret = '';
    if (r.stocks.length) {
      const avg = r.stocks.reduce((s, x) => s + (priceOf(x) - x.buyPrice) / x.buyPrice * 100, 0) / r.stocks.length;
      ret = `<div class="timeline-return" style="color:${clr(avg)}">${pct(avg)}</div>`;
    }
    return `<div class="timeline-item">
      <div class="timeline-dot ${r.status}">${r.status==='done'?'✓':r.status==='current'?'▶':r.id}</div>
      <div class="timeline-label">${r.label}${r.date?' · '+r.date.substring(5):''}</div>
      <div class="timeline-stocks">${tickers}</div>${ret}
    </div>`;
  }).join('');
  document.getElementById('timelineList').innerHTML = html;
}

function renderTabs() {
  document.getElementById('roundTabs').innerHTML = currentSeason().rounds.map(r =>
    `<button class="round-tab ${r.id===curRound?'active':''} ${r.status==='upcoming'?'locked':''}"
      ${r.status!=='upcoming'?`onclick="selectRound(${r.id})"`:''}>${r.label}${r.status==='current'?' ●':''}</button>`
  ).join('');
}

function renderStocks() {
  const round = currentSeason().rounds.find(r => r.id === curRound);
  if (!round) return;
  document.getElementById('roundTitle').textContent = `${round.label} 선정 종목${round.date?' — '+round.date:''}`;

  if (!round.stocks.length) {
    document.getElementById('stocksGrid').innerHTML = `<div class="empty-state"><div class="icon">🔒</div><div>아직 종목이 선정되지 않았습니다</div></div>`;
    return;
  }

  document.getElementById('stocksGrid').innerHTML = round.stocks.map(s => {
    const isExited = !!s.exitDate;
    const shownPrice = priceOf(s);
    const chg = shownPrice - s.buyPrice;
    const chgPct = chg / s.buyPrice * 100;
    const totalShares = seasonMembers().reduce((sum, m) => {
      const h = m.holdings.find(h => h.ticker === s.ticker && h.season === curSeason);
      return sum + (h ? h.quantity : 0);
    }, 0);
    const priceLabel = (isExited && viewMode === 'exit') ? '청산가' : '현재가';
    const exitBadge = isExited ? `<span class="exit-badge" title="청산일 ${s.exitDate}">청산</span>` : '';
    const exitNote  = isExited
      ? `<div class="exit-note">청산일 ${s.exitDate}${viewMode==='live' ? ' · 현재가 기준 표시' : ''}</div>`
      : '';
    return `<div class="stock-card">
      <div class="stock-card-header">
        <div class="stock-info">
          <div class="ticker-badge">${s.ticker}</div>
          <div><div class="stock-name">${s.name}${exitBadge}</div><div class="stock-sector">${s.sector}</div></div>
        </div>
        <div class="stock-price-info">
          <div class="current-price">$${shownPrice.toFixed(2)}</div>
          <div class="price-change ${chgPct>=0?'up':'down'}">${chgPct>=0?'▲':'▼'} ${pct(chgPct)} (${chg>=0?'+':''}$${chg.toFixed(2)})</div>
          ${exitNote}
        </div>
      </div>
      <div class="stock-card-body">
        <div class="metrics-row">
          <div class="metric-box"><div class="metric-label">매수가</div><div class="metric-value">$${s.buyPrice.toFixed(2)}</div></div>
          <div class="metric-box"><div class="metric-label">${priceLabel}</div><div class="metric-value" style="color:${clr(chg)}">$${shownPrice.toFixed(2)}</div></div>
          <div class="metric-box"><div class="metric-label">팀 보유</div><div class="metric-value">${totalShares}주</div></div>
        </div>
        ${isExited ? '' : `${rsiHtml(s.rsi)}
        ${s.recReason ? `<div style="font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6"><span style="color:var(--accent)">💡 의견:</span> ${s.recReason}</div>` : ''}
        ${newsArticlesHtml(s.news) ? `<div class="news-section">
          <div class="news-section-title">📰 관련 뉴스</div>
          <div class="news-articles">${newsArticlesHtml(s.news)}</div>
        </div>` : ''}`}
      </div>
    </div>`;
  }).join('');
}

function renderAllocation() {
  const sm = stockMap();
  const totals = {};
  seasonMembers().forEach(m => m.holdings.filter(h=>h.season===curSeason).forEach(h => {
    const s = sm[h.ticker];
    if (!s) return;
    totals[h.ticker] = (totals[h.ticker]||0) + h.quantity * priceOf(s);
  }));
  const total = Object.values(totals).reduce((a,b)=>a+b,0);
  const colors = ['#6c63ff','#ff6584','#00d4aa','#ffd166','#ff9f43','#74c0fc'];
  const sorted = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  document.getElementById('allocList').innerHTML = sorted.map(([ticker, val], i) => {
    const p = total > 0 ? val/total*100 : 0;
    return `<div class="legend-item">
      <div class="legend-left"><div class="legend-dot" style="background:${colors[i%colors.length]}"></div><span>${ticker} <span style="color:var(--text2);font-size:11px">${sm[ticker]?.name||''}</span></span></div>

const MARKET_INDICES = [
  { name: 'S&P500',      ticker: '^GSPC',  group: '미국 시장' },
  { name: 'NASDAQ',      ticker: '^IXIC',  group: '미국 시장' },
  { name: '다우존스',     ticker: '^DJI',   group: '미국 시장' },
  { name: 'VIX',         ticker: '^VIX',   group: '공포지수' },
  { name: '미국10년금리', ticker: '^TNX',   group: '환율 / 금리' },
  { name: '원달러환율',   ticker: 'KRW=X',  group: '환율 / 금리' },
  { name: 'KOSPI',       ticker: '^KS11',  group: '한국 시장' },
  { name: 'KOSDAQ',      ticker: '^KQ11',  group: '한국 시장' }
];

async function fetchMarketData() {
  const proxy = 'https://corsproxy.io/?';
  const results = await Promise.allSettled(MARKET_INDICES.map(async idx => {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(idx.ticker)}?range=3mo&interval=1d`;
    const r = await fetch(proxy + encodeURIComponent(url));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const result = data.chart.result && data.chart.result[0];
    if (!result) throw new Error('empty');
    const closes = result.indicators.quote[0].close;
    const timestamps = result.timestamp || [];
    const labels = [], series = [];
    for (let i = 0; i < timestamps.length; i++) {
      const c = closes[i];
      if (c === null || c === undefined) continue;
      const d = new Date(timestamps[i] * 1000);
      labels.push(`${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`);
      series.push(Math.round(c * 100) / 100);
    }
    if (series.length < 2) throw new Error('insufficient data');
    const value = series[series.length - 1];
    const prev  = series[series.length - 2];
    const change = ((value - prev) / prev) * 100;
    return { ...idx, value, change: Math.round(change * 100) / 100, labels, series };
  }));

  const cards = [];
  const groupMap = {};
  results.forEach(r => {
    if (r.status !== 'fulfilled') return;
    const d = r.value;
    cards.push({ name: d.name, value: d.value, change: d.change });
    if (!groupMap[d.group]) groupMap[d.group] = { name: d.group, labels: d.labels, series: [] };
    groupMap[d.group].series.push({ name: d.name, data: d.series });
  });
  return { cards, groups: Object.values(groupMap) };
}

async function fetchNewsForStocks() {
  const proxy = 'https://corsproxy.io/?';
  const tickerSet = new Set();
  DATA.seasons.forEach(sn => sn.rounds.forEach(r => r.stocks.forEach(s => {
    if (!s.exitDate) tickerSet.add(s.ticker);
  })));

  const posRE = /surge|soar|jump|beat|rise|gain|high|record|strong|growth|profit|up|bull|rally/;
  const negRE = /fall|drop|plunge|miss|decline|loss|low|down|weak|cut|layoff|warn|concern|risk|sue|fine/;

  const newsMap = {};
  await Promise.allSettled([...tickerSet].map(async ticker => {
    try {
      const url = `https://news.google.com/rss/search?q=${encodeURIComponent(ticker + ' stock')}&hl=en-US&gl=US&ceid=US:en`;
      const r = await fetch(proxy + encodeURIComponent(url));
      if (!r.ok) return;
      const xml = await r.text();
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      const items = [...doc.querySelectorAll('item')].slice(0, 4);
      newsMap[ticker] = items.map(item => {
        const rawTitle = item.querySelector('title')?.textContent || '';
        const link     = item.querySelector('link')?.textContent  || '';
        const pubDate  = item.querySelector('pubDate')?.textContent || '';
        const m = rawTitle.match(/^(.*)\s[-–]\s([^-–]+)$/);
        const title     = (m ? m[1] : rawTitle).trim();
        const publisher = m ? m[2].trim() : '';
        let date = '';
        try {
          const d = new Date(pubDate);
          date = `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ` +
                 `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        } catch(e) {}
        const lower = title.toLowerCase();
        let type = 'neutral';
        if (posRE.test(lower)) type = 'positive';
        if (negRE.test(lower)) type = 'negative';
        return { type, title, publisher, link, date };
      });
    } catch (e) {}
  }));

  DATA.seasons.forEach(sn => sn.rounds.forEach(r => r.stocks.forEach(s => {
    if (newsMap[s.ticker] !== undefined) s.news = newsMap[s.ticker];
  })));
}

// ── RSI (프론트 fetch, Yahoo 1개월 일봉 → 14-period 단순 평균) ──
let _rsiLoading = true;

function computeRSIClient(closes, period) {
  period = period || 14;
  const c = (closes || []).filter(x => x !== null && !isNaN(x));
  if (c.length < period + 1) return null;
  const slice = c.slice(-period - 1);
  let gains = 0, losses = 0;
  for (let i = 1; i < slice.length; i++) {
    const d = slice[i] - slice[i-1];
    if (d > 0) gains += d;
    else losses -= d;
  }
  const avgGain = gains / period;
  const avgLoss = losses / period;
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return Math.round((100 - 100 / (1 + rs)) * 10) / 10;
}

async function fetchRSIForStocks() {
  const proxy = 'https://corsproxy.io/?';
  const tickerSet = new Set();
  DATA.seasons.forEach(sn => sn.rounds.forEach(r => r.stocks.forEach(s => {
    if (!s.exitDate) tickerSet.add(s.ticker);
  })));

  const rsiMap = {};
  await Promise.allSettled([...tickerSet].map(async ticker => {
    try {
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?range=1mo&interval=1d`;
      const r = await fetch(proxy + encodeURIComponent(url));
      if (!r.ok) return;
      const data = await r.json();
      const result = data.chart.result && data.chart.result[0];
      if (!result) return;
      const closes = result.indicators.quote[0].close;
      const rsi = computeRSIClient(closes);
      if (rsi !== null) rsiMap[ticker] = rsi;
    } catch (e) {}
  }));

  // 종목 객체에 rsi 주입
  DATA.seasons.forEach(sn => sn.rounds.forEach(r => r.stocks.forEach(s => {
    if (rsiMap[s.ticker] !== undefined) s.rsi = rsiMap[s.ticker];
  })));
}

function computeAlerts() {
  const season = currentSeason();
  const items = [];

  // 시즌 전체 청산 완료
  const seasonStocks = season.rounds.flatMap(r => r.stocks);
  const activeStocks = seasonStocks.filter(s => !s.exitDate);
  if (seasonStocks.length && activeStocks.length === 0) {
    items.push({ type: 'info', icon: '🏁', msg: `${season.label} 전 종목 청산 완료` });
  }

  // 개별 종목 급등·급락
  seasonStocks.forEach(s => {
    const p = priceOf(s);
    const chgPct = (p - s.buyPrice) / s.buyPrice * 100;
    if (chgPct >= 30) {
      items.push({ type: 'buy',  icon: '📈', msg: `${s.ticker} ${pct(chgPct)}` });
    } else if (chgPct <= -20) {
      items.push({ type: 'sell', icon: '📉', msg: `${s.ticker} ${pct(chgPct)}` });
    }
  });

  // RSI 시그널 (청산 안 된 종목만)
  activeStocks.forEach(s => {
    if (s.rsi === null || s.rsi === undefined) return;
    if (s.rsi < 30) {
      items.push({ type: 'buy', icon: '📊', msg: `${s.name} RSI ${s.rsi.toFixed(1)} · 과매도` });
    } else if (s.rsi > 70) {
      items.push({ type: 'sell', icon: '📊', msg: `${s.name} RSI ${s.rsi.toFixed(1)} · 과매수` });
    }
  });

  // 다음 회차 리서치 대기
  const upcoming = season.rounds.find(r => r.status === 'upcoming');
  if (upcoming && !items.some(x => x.type === 'info')) {
    items.push({ type: 'info', icon: '🗓', msg: `${upcoming.label} 대기 중` });
  }

  return items;
}

function rsiHtml(rsi) {
  if (rsi === null || rsi === undefined) {
    const msg = _rsiLoading ? '로딩 중...' : '데이터 없음';
    return `<div class="rsi-box">
      <div class="rsi-head"><span class="rsi-title">RSI <span class="rsi-title-full">(14일)</span></span></div>
      <div class="rsi-empty">${msg}</div>
    </div>`;
  }
  const pos = Math.max(0, Math.min(100, rsi));
  let cls = 'neutral', label = '중립';
  if (rsi < 30) { cls = 'oversold'; label = '과매도'; }
  else if (rsi > 70) { cls = 'overbought'; label = '과매수'; }
  const color = rsi < 30 ? 'var(--green)' : rsi > 70 ? 'var(--red)' : 'var(--text)';
  return `<div class="rsi-box">
    <div class="rsi-head">
      <span class="rsi-title">RSI <span class="rsi-title-full">(Relative Strength Index, 14일)</span></span>
      <span><span class="rsi-value" style="color:${color}">${rsi.toFixed(1)}</span><span class="rsi-status ${cls}">${label}</span></span>
    </div>
    <div class="rsi-bar"><div class="rsi-pointer" style="left:${pos}%"></div></div>
    <div class="rsi-scale"><span>0</span><span>30</span><span>70</span><span>100</span></div>
  </div>`;
}

function renderAll() {
  try {

    const sr = currentSeason().rounds;
    curRound = sr.find(r=>r.status==='current')?.id || sr.filter(r=>r.status!=='upcoming').slice(-1)[0]?.id || sr[0]?.id || 1;
    updateViewModeBar();
    renderSeasonTabs();
    renderStats();

function renderRoundMembers() {
  const round = currentSeason().rounds.find(r => r.id === curRound) || null;
  const section = document.getElementById('roundMembersSection');

  if (!round || !round.stocks.length) { section.style.display = 'none'; return; }
  section.style.display = '';

  const sm = stockMap();
  const tickers = round.stocks.map(s => s.ticker);
  document.getElementById('roundMembersTitle').textContent = `${round.label} 멤버별 투자 현황`;

  // 헤더
  const thTickers = tickers.map(t =>
    `<th class="right" colspan="2" style="border-left:1px solid var(--border)">${t} <span style="color:var(--text2);font-weight:400;font-size:10px">${sm[t]?.name||''}</span></th>`
  ).join('');
  document.getElementById('roundMembersHead').innerHTML = `
    <tr>
      <th>멤버</th>
      ${thTickers}
      <th class="right" style="border-left:1px solid var(--border)">투자금</th>
      <th class="right">평가금</th>
      <th class="right">수익금</th>
      <th class="right">수익률</th>
    </tr>
    <tr style="font-size:10px;color:var(--text2)">
      <th></th>
      ${tickers.map(() => '<th class="right" style="border-left:1px solid var(--border)">수량</th><th class="right">매수가</th>').join('')}
      <th></th><th></th><th></th><th></th>
    </tr>`;

  // 바디 — 수익률 높은 순, 미참여는 마지막
  const memberRows = seasonMembers().map(m => {
    let totalCost = 0, totalVal = 0;
    const cells = tickers.map(ticker => {
      const h = m.holdings.find(h => h.ticker === ticker && h.round === curRound && h.season === curSeason);
      const s = sm[ticker];
      if (!h || !s) return `<td class="right" style="border-left:1px solid var(--border);color:var(--text2)">—</td><td class="right" style="color:var(--text2)">—</td>`;
      const cost = h.quantity * h.buyPrice;
      const val  = h.quantity * priceOf(s);
      totalCost += cost; totalVal += val;
      return `<td class="right" style="border-left:1px solid var(--border)">${h.quantity}주</td>
              <td class="right" style="color:var(--text2)">$${h.buyPrice.toFixed(2)}</td>`;
    }).join('');
    const totalPnl = totalVal - totalCost;
    const p = totalCost > 0 ? totalPnl / totalCost * 100 : null;
    return { m, cells, totalCost, totalVal, totalPnl, p };
  });

  memberRows.sort((a, b) => {
    if (a.p === null && b.p === null) return 0;
    if (a.p === null) return 1;
    if (b.p === null) return -1;
    return b.p - a.p;
  });

  const rows = memberRows.map(({ m, cells, totalCost, totalVal, totalPnl, p }) => {
    if (p === null) return `<tr>
      <td><div class="member-name"><div class="avatar" style="background:${m.color}20;color:${m.color}">${m.name[0]}</div>${m.name}</div></td>
      ${tickers.map(() => `<td class="right" style="border-left:1px solid var(--border);color:var(--text2)">—</td><td class="right" style="color:var(--text2)">—</td>`).join('')}
      <td class="right" style="border-left:1px solid var(--border);color:var(--text2)">미참여</td><td></td><td></td><td></td>
    </tr>`;
    return `<tr>
      <td><div class="member-name"><div class="avatar" style="background:${m.color}20;color:${m.color}">${m.name[0]}</div>${m.name}</div></td>
      ${cells}
      <td class="right" style="border-left:1px solid var(--border);color:var(--text2)">${usd(totalCost)}</td>
      <td class="right">${usd(totalVal)}</td>
      <td class="right" style="color:${clr(totalPnl)}">${totalPnl>=0?'+':''}${usd(totalPnl)}</td>
      <td class="right"><span class="tag ${p>=0?'tg':'tr'}">${pct(p)}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('roundMembersBody').innerHTML = rows;

  document.getElementById('roundMemberCards').innerHTML = memberRows.map(({ m, totalCost, totalVal, totalPnl, p }) => {
    const holdings = tickers.map(ticker => {
      const h = m.holdings.find(h => h.ticker === ticker && h.round === curRound && h.season === curSeason);
      if (!h) return '';
      return `<div class="m-row"><span class="m-row-label">${ticker}</span><span>${h.quantity}주 @ $${h.buyPrice.toFixed(2)}</span></div>`;
    }).join('');
    if (p === null) return `<div class="m-card">
      <div class="m-card-header">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="avatar" style="background:${m.color}20;color:${m.color}">${m.name[0]}</div>
          <span style="font-weight:600">${m.name}</span>
        </div>
        <span style="font-size:12px;color:var(--text2)">미참여</span>
      </div>
    </div>`;
    return `<div class="m-card">
      <div class="m-card-header">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="avatar" style="background:${m.color}20;color:${m.color}">${m.name[0]}</div>
          <span style="font-weight:600">${m.name}</span>
        </div>
        <span class="tag ${p>=0?'tg':'tr'}">${pct(p)}</span>
      </div>
      <div class="m-card-body">
        ${holdings}
        <div class="m-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px">
          <span class="m-row-label">투자금</span><span>${usd(totalCost)}</span>
        </div>
        <div class="m-row">
          <span class="m-row-label">수익금</span>
          <span style="color:${clr(totalPnl)}">${totalPnl>=0?'+':''}${usd(totalPnl)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderSeasonTabs() {

    </div>
    <table style="width:100%">
      <thead><tr style="background:var(--surface2)">
        <th style="padding:8px;text-align:left;font-size:11px;color:var(--text2)">종목</th>
        <th style="padding:8px;text-align:right;font-size:11px;color:var(--text2)">수량</th>
        <th style="padding:8px;text-align:right;font-size:11px;color:var(--text2)">매수금</th>
        <th style="padding:8px;text-align:right;font-size:11px;color:var(--text2)">평가금</th>

async function fetchData() {
  if (!SCRIPT_URL) return;
  const el = document.getElementById('lastUpdated');
  el.textContent = '⏳ 시트 데이터 업데이트 중...';
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(SCRIPT_URL, { signal: ctrl.signal });
    clearTimeout(t);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    // 구형 응답(rounds) → 시즌 구조 자동 변환
    if (json.rounds && !json.seasons) {
      json.seasons = [{ id:'26봄', label:'26봄', status:'current', rounds: json.rounds }];
      (json.members || []).forEach(m => m.holdings.forEach(h => { if (!h.season) h.season = '26봄'; }));
    }
    DATA = json;
    _lastNewsAt = new Date().toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    el.textContent = '최근 업데이트: ' + _lastNewsAt;
  } catch(e) {
    clearTimeout(t);
    el.textContent = e.name==='AbortError' ? '⚠️ 시트 연결 시간 초과 (샘플 데이터)' : '⚠️ 시트 연결 실패 (샘플 데이터)';
    return;
  }
  renderAll();
  loadMarketAsync();
  loadRSIAsync();
  loadNewsAsync();
}

// ── 자동 새로고침 (5분) ───────────────────────────────────────
const REFRESH_MS = 5 * 60 * 1000;
let _refreshTimeout = null;
let _countdownInterval = null;
let _nextAt = 0;
let _lastNewsAt = '';

function startAutoRefresh() {
  clearTimeout(_refreshTimeout);
  clearInterval(_countdownInterval);
  _nextAt = Date.now() + REFRESH_MS;

  _countdownInterval = setInterval(() => {
    const left = Math.max(0, _nextAt - Date.now());
    const m = Math.floor(left / 60000);
    const s = Math.floor((left % 60000) / 1000);
    const el = document.getElementById('nextRefresh');
    if (el) el.textContent = `다음 뉴스 업데이트 ${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);

  _refreshTimeout = setTimeout(() => {
    fetchData().finally(startAutoRefresh);
  }, REFRESH_MS);
}

function refresh() {
  clearTimeout(_refreshTimeout);
  clearInterval(_countdownInterval);
  fetchData().finally(startAutoRefresh);
}

// 즉시 렌더 → 백그라운드 시트 & 뉴스 & 시장 지수 & RSI 업데이트
renderAll();
loadMarketAsync();
loadRSIAsync();
loadNewsAsync();
document.getElementById('lastUpdated').textContent = '샘플 데이터';
fetchData().finally(startAutoRefresh);
</script>
